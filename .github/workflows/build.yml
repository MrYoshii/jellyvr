name: Build

# Compile check on every push to main and on pull requests (no release, no secrets).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build Jellyfin.Plugin.DeoVR/Jellyfin.Plugin.DeoVR.csproj -c Release -warnaserror
