name: Release

# Publish a GitHub release with a tag like v1.0.0 -> build, attach zip, update manifest.json on main
on:
  release:
    types: [published]

permissions:
  contents: write

env:
  TARGET_ABI: '12.4.0.0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' is not of the form vX.Y.Z" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Tag must be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        id: build
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}.0"            # v1.0.0 -> 1.0.0.0
          ZIP="deovr_${VERSION}.zip"
          dotnet publish Jellyfin.Plugin.DeoVR/Jellyfin.Plugin.DeoVR.csproj -c Release -o out \
            -p:AssemblyVersion="$VERSION" -p:FileVersion="$VERSION" -p:Version="$VERSION"
          mkdir pkg
          cp out/Jellyfin.Plugin.DeoVR.dll pkg/
          python3 scripts/manifest.py meta --version "$VERSION" --abi "$TARGET_ABI" > pkg/meta.json
          (cd pkg && zip -q "../$ZIP" *)
          sha256sum "$ZIP" > "$ZIP.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "md5=$(md5sum "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Attach files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          gh release upload "$TAG" "$ZIP" "$ZIP.sha256" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Update manifest.json on main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.build.outputs.version }}
          ZIP: ${{ steps.build.outputs.zip }}
          MD5: ${{ steps.build.outputs.md5 }}
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          python3 scripts/manifest.py update \
            --version "$VERSION" \
            --abi "$TARGET_ABI" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}" \
            --md5 "$MD5" \
            --changelog "Release ${TAG}" \
            --owner "${GITHUB_REPOSITORY_OWNER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "manifest: ${VERSION}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
